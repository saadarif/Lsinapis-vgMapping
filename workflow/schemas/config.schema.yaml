$schema: "http://json-schema.org/draft-07/schema#"
description: "Configuration schema for the VG mapping pipeline"
type: object

# Define required top-level keys
required:
  - ref_name
  - reference
  - vg_prefix
  - modern_csv
  - historical_csv
  - params

properties:
  ref_name:
    type: string
    description: "Short name for the reference genome used in naming outputs."
  
  reference:
    type: string
    description: "Full path to the reference FASTA (without .fa extension)."

  vg_prefix:
    type: string
    description: "Full path prefix for the variation graph (.xg, .gcsa files)."

  modern_csv:
    type: string
    description: "Path to the TSV/CSV metadata for modern samples."

  historical_csv:
    type: string
    description: "Path to the TSV/CSV metadata for historical samples."

  run_multiqc:
    type: boolean
    default: true

  mapQ:
    type: integer
    minimum: 0
    maximum: 30
    default: 30

  baseQ:
    type: integer
    minimum: 0
    maximum: 30
    default: 20

  params:
    type: object

  threads_mapping:
    type: integer
    minimum: 1
    default: 16