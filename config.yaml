# --- Reference Files ---
#Currently this snakefile is for mapping trimmed reads to a reference genome variation graph
# as descibed here: https://github.com/zjnolen/polyommatini-temporal-genomics/blob/main/analyses/workflow/rules/vg-map.smk

#Name for the reference, appended to all output files
ref_name: "DTOLREF"
#full path to reference without the .fa extension
reference: "/mnt/sda/saad/WW_Trimmed_Reads_WWPaper/ref_genome/Leptidea_sinapis-GCA_905404315.1-softmasked"
#Prefix of variation graph
vg_prefix: "/mnt/sda/saad/WW_Trimmed_Reads_WWPaper/vgconstruct/DTOLREF.modvars"
#Site filter bed
# a bed file for target regions to retain, e.g. no repeats, no sex chromosomes, no mtDNA, no collapsed regions, no regions with low mappability, etc. Can be generated using bedtools intersect -v with a bed file of all sites and a bed file of sites to exclude
site_filter_bed: "/mnt/sda/saad/WW_Trimmed_Reads_WWPaper/ref_genome/ZNolen_site_filters/Leptidea_sinapis-GCA_905404315.1-softmasked_autosomes_minScaf1MB_repma_snpabble_collma.bed"


# --- Input Metadata ---
modern_csv: "modern_samples.tsv"
historical_csv: "historical_samples.tsv"

# --- Analysis Toggles ---
run_multiqc: TRUE
#TODO: the individual genotyping rule is redundant for modern BAMS in the run_genotyping_rescaled workflow, but it is simpler to extract those gennotypes from
run_genotyping_notrans: TRUE #removes transitions and genotypes over the site_filter_bed, which is more conservative and may be better for low coverage historical samples.
run_genotyping_rescaled: TRUE #genotyping for historical rescaled BAMs from mapDamage, usining the same site_filter_bed as the notrans workflow,
run_diversity_stats: TRUE #per-individual heterozygosity from the bcftools stats files, plus windowed pi, dxy and Fst with pixy
run_relatedness: TRUE #one ANGSD beagle file for all samples, then pairwise R0, R1 and KING-robust kinship with ngsRelate (IBSrelate)
run_ld_estimation: TRUE #pairwise LD with ngsLD on the relatedness beagle file, pruned to unlinked SNPs with prune_graph
run_pca: TRUE #PCA with PCAngsd on the LD-pruned beagle file, after dropping any individuals under params: run_pca: exclude_samples
run_admixture: FALSE #NGSadmix for K = 1..max_k (replicated to convergence) + evalAdmix model fit, on the same beagle file as the PCA
run_roh: FALSE #runs ROH on specified vcf files

# --- Subsampling ---
#Ids of samples in quotes that need to be susbsampled
subsample_samples: ["M1", "M2", "M3", "M4"]
subsample_depth: 15

#------Software configurations------

mapQ: 30
baseQ: 20

#Specific params for each workflow, which can be adjusted as needed. See the workflow scripts for more details on what each parameter does.S
params:
  run_genotyping:
    minDP: 6
    maxDP: 30 #determined as 2x average coverage of modern samples, can be adjusted based on coverage distribution of historical samples. This is a hard filter that will set genotypes to missing if they fall outside this range, so be conservative with this value.  
    # Provide an array of missingness values (default to [0.0] if empty)
    maxMissing: [0.0, 0.1, 0.2, 0.3]
    # Provide a list of sample_ids to drop from the final merge
    drop_samples: ["NHM091"]
    #TODO: THIS file is also required by pixy and should appear above instead of here to avoid repettions
    poplist: "Pops_GTS.txt"  # <--- two column text file with sample_id in first column and population in second column, no header
    # the poplist should include samples in the drop_samples list,

  run_diversity_stats:
    # Which genotyping workflows to summarise: "notrans", "rescaled", or both.
    # A workflow listed here is skipped if its run_genotyping_* toggle is FALSE.
    datasets: ["notrans"]
    # Which calling modes to summarise: "indCall", "jointCall", or both
    call_types: ["jointCall"]
    # pi and dxy are only unbiased when invariant sites are retained, so leave
    # this as allsites for pixy
    site_types: ["allsites"]
    # Stats are always summarised for every maxMissing value above
    # --- pixy settings ---
    window_size: 50000
    fst_type: "hudson"  # 'hudson' (Hudson 1992, Bhatia et al. 2013) or 'wc' (Weir & Cockerham 1984)
    n_cores: 8
    extra: ""  # any additional pixy flags, e.g. ""--sites_file"" to limit to 4D sites etc."
    # pixy reuses the filtered poplist written by the genotyping workflows, which
    # is params: run_genotyping: poplist with drop_samples removed

  run_relatedness:
    # Which BAM set the genotype likelihoods are built from:
    #   "dedup"    -> (default) historical deduplicated (unrescaled) + modern
    #                 clipped, the BAM set the no-transitions genotyping uses.
    #                 Paired with rm_trans: 1 below by default.
    #   "rescaled" -> historical mapDamage rescaled + modern clipped (final BAMs).
    #                 Damage is down-weighted in the base qualities instead of
    #                 filtered out. Opt in explicitly when that's what's wanted.
    bam_stage: "dedup"
    gl_model: 2          # ANGSD -GL: 1=SAMtools, 2=GATK, 3=SOAPsnp, 4=SYK
    minDP_ind: 3         # -setMinDepthInd, individual dropped from a site below this
    maxDP_ind: 30        # -setMaxDepthInd, individual dropped from a site above this
    min_ind_frac: 0.9    # -minInd as a fraction of the samples analysed, counted after
                         # the per-individual depth filter (rounded up)
    min_maf: 0.05        # -minMaf
    snp_pval: "1e-6"     # -SNP_pval, quoted so it stays a string in the file names
    rm_trans: 1          # -rmTrans, 1 drops A<->G and C<->T sites (damage). Matches
                         # the default bam_stage: "dedup" above; set to 0 if switching
                         # to bam_stage: "rescaled", where damage is down-weighted
                         # in the base qualities instead.
    extra: ""            # any further ANGSD flags, e.g. "-only_proper_pairs 0 -C 50"
    threads: 16
    # Own drop_samples, independent of params: run_genotyping: drop_samples. Empty by
    # default so every sample is included, since relatedness is often the analysis
    # used to decide who to drop in the first place. List sample_ids here to exclude
    # specific samples (e.g. known duplicates/outgroups) instead. But if the depth is too low
    # for a sample to be included in the genotyping, it will be dropped automatically by ANGSD and not appear in the final relatedness output.
    drop_samples: []
    # ngsRelate is run without an allele frequency file, so R0, R1 and KING come from
    # the pairwise 2D-SFS (the allele-frequency-free IBSrelate estimator)

  run_ld_estimation:
    max_kb_dist_ld-est: 4000        # ngsLD --max_kb_dist (KB): compute LD for SNP pairs within this distance
    rnd_sample_ld-est: 1.00          # ngsLD --rnd_sample: randomly sample this fraction of SNPs for LD estimation..
    threads_ld-est: 10  #threads for ngsLD estimate step
    prune_max_dist_bp: 50000 # prune_graph distance cutoff, in BASES (not kb): edges beyond this are
                              # ignored when pruning, independent of max_kb_dist above. Must be <=
                              # max_kb_dist*1000 to have any effect, since ngsLD never computes LD
                              # for pairs further apart than max_kb_dist in the first place.
    prune_min_r2: 0.1               # r2 at/above which two SNPs within prune_max_dist_bp count as linked
    threads_prune: 4  #threads for prune_graph step

  run_pca:
    # Sample IDs to drop from the LD-pruned beagle file before PCA, e.g. close
    # relatives flagged in params: run_relatedness's ibsrelate.R0R1KING.tsv output
    # (4_relatedness.smk). Empty by default (PCA on every genotyped sample).
    exclude_samples: ["LsSpa8", "M8"]
    threads: 8
    extra: ""  # any further PCAngsd flags, e.g. "-e 4" to fix the number of eigenvectors

  run_admixture:
    # Runs on the same beagle file as the PCA, so the individuals dropped are
    # the ones under params: run_pca: exclude_samples above.
    max_k: 7       # NGSadmix is run for every K from 1 to max_k
    minreps: 20    # replicates per K before convergence is first checked
    reps: 100      # maximum replicates per K if they never converge
    thresh: 2      # converged when the 3 highest-likelihood replicates are within
                   # this many log-likelihood units of each other. The best-fit K
                   # is the highest K that converged.
    threads: 4     # per K (NGSadmix -P, evalAdmix -P); different Ks run in parallel
    extra: ""      # any further NGSadmix flags, e.g. "-minMaf 0.05"
    # Two columns, sample_id and population, no header. Only used to group
    # individuals in the plots. Must cover every sample in the beagle file.
    poplist: "Pops.txt"

  run_roh:
    #calls roh on specified vcf files
    datasets: ["notrans"]
    # Which calling modes to summarise: "indCall", "jointCall", or both
    call_types: ["jointCall"]
    rec_rate: "7.4e-8" #perbase recombination rate, from https://genome.cshlp.org/content/33/5/810.long
    threads: 6


# --- Resource Allocation ---
threads_mapping: 16
threads_dedup: 8
